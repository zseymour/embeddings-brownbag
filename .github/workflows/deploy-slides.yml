name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - talk/**
      - .github/workflows/deploy-slides.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
        working-directory: talk
      - run: bun run build -- --base "${{ steps.pages.outputs.base_path }}/"
        working-directory: talk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: talk/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
